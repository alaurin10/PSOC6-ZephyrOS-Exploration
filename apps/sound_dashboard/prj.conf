# Kconfig fragment: selects which kernel features/drivers get compiled in.
# Inspect the fully resolved config with: west build -t menuconfig

# ---- Core -----------------------------------------------------------------------

CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_THREAD_NAME=y

# Hardware FPU for the audio DSP. Several threads use floats (DSP, thermistor),
# so the FPU context is saved per thread.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Interactive shell on the console UART (KitProg3 COM port, 115200 8N1).
# Log messages are routed through the shell so they don't break the prompt.
CONFIG_SHELL=y

# Per-thread CPU usage ("kernel thread list") for load measurements.
CONFIG_THREAD_RUNTIME_STATS=y

# Emit the kernel-structure offsets table that OpenOCD's Zephyr RTOS
# awareness reads, so the debugger can list every thread and its stack.
CONFIG_DEBUG_THREAD_INFO=y

# Hardware watchdog (fed by the liveness supervisor in app_watchdog.c)
CONFIG_WATCHDOG=y

# ---- Thermistor -----------------------------------------------------------------

# ADC for the onboard thermistor, TCPWM counter that paces its sampling
CONFIG_ADC=y
CONFIG_COUNTER=y

# ---- Microphone -------------------------------------------------------------------

# DMIC API; the PSoC 6 PDM driver itself is in ext/drivers/audio. It moves
# the samples with DMA (DataWire 1 channel 26) by default.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# CMSIS-DSP for the FFT (fetched by cmake/fetch_modules.cmake)
CONFIG_CMSIS_DSP=y

# ---- Networking ---------------------------------------------------------------------

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
# The Wi-Fi manager follows connect/disconnect/address events (with their details).
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=20
# Name sent with DHCP requests (and answered by mDNS as psoc6.local).
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="psoc6"
# Clock from SNTP (pool.ntp.org, resolved through the DNS server DHCP hands out)
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
# No hardware entropy driver for this SoC in Zephyr: TCP sequence numbers and
# DNS IDs come from a pseudo-random generator (fine on a home LAN).
CONFIG_TEST_RANDOM_GENERATOR=y
# "net iface", "net stats", "net conn", ...
CONFIG_NET_SHELL=y

# Network buffers: sized for a few browsers, not for throughput.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16

# ---- Wi-Fi --------------------------------------------------------------------------

# CYW4343W over SDIO (AIROC driver; the board picks the chip and firmware).
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
# "wifi scan", "wifi status", "wifi connect ..."
CONFIG_NET_L2_WIFI_SHELL=y
# Stored networks ("wifi cred add/list/delete"), kept in flash through Settings.
CONFIG_WIFI_CREDENTIALS=y

# ---- Web dashboard --------------------------------------------------------------------

# HTTP/1.1 only: browsers speak HTTP/2 only over TLS, and WebSockets upgrade
# from HTTP/1.1. A page uses up to three connections (page, script, socket).
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_WEBSOCKET=y
# One WebSocket context per dashboard client (WS_MAX_CLIENTS in web_server.c)
# plus a spare to refuse one more with a "busy" close; the default of 1
# fails every browser after the first.
CONFIG_WEBSOCKET_MAX_CONTEXTS=4
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_JSON_LIBRARY=y
# File descriptors and poll entries for the server's sockets, the WebSocket
# clients and the eventfd that wakes the web thread.
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=16
CONFIG_ZVFS_EVENTFD_MAX=4
# psoc6.local, and a DNS-SD record for the HTTP service
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# ---- zbus and state machines ----------------------------------------------------

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_CHANNEL_PUBLISH_STATS=y
# Message subscribers get a copy of every message, in order (commands must not
# be lost). Copies come from a fixed pool rather than the heap.
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=96
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16

# State Machine Framework for the UI controller: hierarchical states
# (parent/child) and initial transitions into a parent's default child.
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y

# ---- Persistent settings ----------------------------------------------------------

# Settings subsystem -> ZMS -> flash map -> flash driver.
# PSoC 6 flash writes whole 512-byte rows, so ZMS needs a 512-byte internal
# block (default 32), and every entry takes a whole row. Sectors of 16 rows
# (8 KB) leave 13 rows each for entries after ZMS's own bookkeeping; with
# 4 KB sectors only 4 were left. See storage_partition in the board overlay.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_ZMS_CUSTOMIZE_BLOCK_SIZE=y
CONFIG_ZMS_CUSTOM_BLOCK_SIZE=512
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_SECTOR_SIZE_MULT=16
CONFIG_SETTINGS_SHELL=y

# ZMS keeps 512-byte buffers on the stack of whichever thread calls it:
# main (settings_load), settings_wq (saves, see app_settings.c) and the shell
# ("settings write"). Garbage collection nests them: ~2.4 KB measured.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096

# ---- QSPI flash and data log ------------------------------------------------------

# The 64 MB QSPI NOR (driver in ext/drivers/flash, partition in the overlay).
# "flash" shell: read, write, erase and test any flash device.
CONFIG_FLASH_SHELL=y

# LittleFS on the 16 MB log partition, mounted by datalog.c. Erase blocks are
# 256 KB, so files grow in 256 KB steps; reads and programs go through 512 B
# caches. Open files: the writer, a download, and "datalog tail" from the
# shell and the web at the same time.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FS_LITTLEFS_READ_SIZE=16
CONFIG_FS_LITTLEFS_PROG_SIZE=16
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_FS_LITTLEFS_NUM_FILES=6
