# Kconfig fragment: selects which kernel features/drivers get compiled in.
# Inspect the fully resolved config with: west build -t menuconfig

# GPIO driver for the LED and the user button
CONFIG_GPIO=y

# Logging subsystem (output goes to the console UART, COM port @ 115200 8N1)
CONFIG_LOG=y

# Give threads human-readable names (useful in logs and debuggers)
CONFIG_THREAD_NAME=y

# Interactive shell on the console UART. Adds built-in commands (help,
# kernel threads, kernel uptime, log, ...) plus our "blink" command.
# Log messages are routed through the shell so they don't break the prompt.
CONFIG_SHELL=y

# Hardware watchdog (fed by the blink thread)
CONFIG_WATCHDOG=y

# ADC driver for the onboard thermistor (channel defined in boards/*.overlay)
CONFIG_ADC=y

# Counter driver: TCPWM hardware timer that paces thermistor sampling
CONFIG_COUNTER=y

# zbus message bus: thermistor publishes on temp_chan, others observe.
# Names and publish counters are only for the "bus" shell command.
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_CHANNEL_PUBLISH_STATS=y

# State Machine Framework for the LED controller: hierarchical states
# (parent/child) and initial transitions into a parent's default child.
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y

# Bluetooth LE host, broadcaster role only (non-connectable advertising).
# The board defaults pick the CYW4343W / Murata 1DX controller over HCI UART
# and embed its firmware patch.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n

# Persistent settings: Settings subsystem -> ZMS -> flash map -> flash driver.
# PSoC 6 flash writes whole 512-byte rows, so ZMS needs a 512-byte internal
# block (default 32) and sectors of 8 rows (4 KB) to fit its bookkeeping.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_ZMS_CUSTOMIZE_BLOCK_SIZE=y
CONFIG_ZMS_CUSTOM_BLOCK_SIZE=512
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_SECTOR_SIZE_MULT=8
# "settings list/read/write/delete" shell commands
CONFIG_SETTINGS_SHELL=y

# ZMS keeps 512-byte buffers on the stack of whichever thread calls it:
# main (settings_load), the system work queue (saves) and the shell.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=3072

# Emit the kernel-structure offsets table that OpenOCD's Zephyr RTOS
# awareness reads, so the debugger can list every thread and its stack.
CONFIG_DEBUG_THREAD_INFO=y
